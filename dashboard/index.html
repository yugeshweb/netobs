<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NetObs</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  body { background:#0b0d10; color:#e6e8eb; font-family: ui-sans-serif, system-ui, sans-serif; }
  ::-webkit-scrollbar { width:8px; height:8px }
  ::-webkit-scrollbar-thumb { background:#2a2f37; border-radius:4px }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

const SEV = {
  critical: { dot:"bg-red-500",    text:"text-red-400",    ring:"ring-red-500/30",    bg:"bg-red-500/10" },
  high:     { dot:"bg-orange-500", text:"text-orange-400", ring:"ring-orange-500/30", bg:"bg-orange-500/10" },
  medium:   { dot:"bg-amber-400",  text:"text-amber-300",  ring:"ring-amber-400/30",  bg:"bg-amber-400/10" },
  low:      { dot:"bg-sky-500",    text:"text-sky-400",    ring:"ring-sky-500/30",    bg:"bg-sky-500/10" },
  info:     { dot:"bg-slate-500",  text:"text-slate-400",  ring:"ring-slate-500/30",  bg:"bg-slate-500/10" },
};

const LABEL = {
  port_scan: "Reconnaissance",
  ddos: "Volumetric attack",
  exfiltration: "Data exfiltration",
  c2_beacon: "C2 beaconing",
  dga_domain: "DGA domain",
  dns_tunnel: "DNS tunnelling",
  encrypted_malware: "Suspicious TLS client",
};

function ago(ts) {
  if (!ts) return "—";
  const d = new Date(ts * 1000);
  return d.toISOString().replace("T", " ").slice(0, 19);
}

function dur(s) {
  if (!s || s < 1) return "—";
  if (s < 60) return `${Math.round(s)}s`;
  if (s < 3600) return `${Math.round(s/60)}m`;
  return `${(s/3600).toFixed(1)}h`;
}

function Summary({ s }) {
  if (!s) return null;
  const order = ["critical","high","medium","low","info"];
  const worst = order.find(k => (s.by_severity||{})[k]) || null;
  return (
    <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5">
      <div className={`rounded-xl p-4 ring-1 ${worst ? SEV[worst].ring : "ring-white/10"} ${worst ? SEV[worst].bg : ""}`}>
        <div className="text-xs uppercase tracking-wide text-slate-400">Highest severity</div>
        <div className={`text-2xl font-semibold mt-1 ${worst ? SEV[worst].text : "text-slate-300"}`}>
          {worst ? worst : "clear"}
        </div>
      </div>
      <div className="rounded-xl p-4 ring-1 ring-white/10">
        <div className="text-xs uppercase tracking-wide text-slate-400">Active incidents</div>
        <div className="text-2xl font-semibold mt-1">{s.incidents_open}</div>
      </div>
      <div className="rounded-xl p-4 ring-1 ring-white/10">
        <div className="text-xs uppercase tracking-wide text-slate-400">Resolved</div>
        <div className="text-2xl font-semibold mt-1 text-slate-400">{s.incidents_closed}</div>
      </div>
      <div className="rounded-xl p-4 ring-1 ring-white/10">
        <div className="text-xs uppercase tracking-wide text-slate-400">Alerts processed</div>
        <div className="text-2xl font-semibold mt-1">{s.alerts_total?.toLocaleString?.() ?? 0}</div>
      </div>
    </div>
  );
}

function Row({ inc, active, onClick }) {
  const c = SEV[inc.severity] || SEV.info;
  return (
    <button onClick={onClick}
      className={`w-full text-left px-4 py-3 border-b border-white/5 hover:bg-white/5 transition
                  ${active ? "bg-white/10" : ""}`}>
      <div className="flex items-center gap-3">
        <span className={`w-2 h-2 rounded-full ${c.dot} shrink-0`}></span>
        <span className="font-medium text-sm">{LABEL[inc.threat_class] || inc.threat_class}</span>
        <span className={`text-[11px] uppercase tracking-wide ${c.text}`}>{inc.severity}</span>
        {inc.status === "open" && (
          <span className="text-[10px] px-1.5 py-0.5 rounded bg-emerald-500/15 text-emerald-300">active</span>
        )}
        <span className="ml-auto text-xs text-slate-400 tabular-nums">
          {inc.count}× · {dur(inc.last_seen - inc.first_seen)}
        </span>
      </div>
      <div className="mt-1 text-xs text-slate-400 font-mono truncate">
        {inc.src}{inc.dst ? ` → ${inc.dst}` : ""}
      </div>
    </button>
  );
}

function Detail({ inc }) {
  const [alerts, setAlerts] = useState([]);
  useEffect(() => {
    if (!inc) return;
    fetch(`/api/incidents/${encodeURIComponent(inc.key)}/alerts?limit=20`)
      .then(r => r.json()).then(setAlerts).catch(() => setAlerts([]));
  }, [inc && inc.key]);

  if (!inc) return (
    <div className="h-full grid place-items-center text-slate-500 text-sm">
      Select an incident to see its evidence
    </div>
  );

  const c = SEV[inc.severity] || SEV.info;
  return (
    <div className="p-5 overflow-y-auto h-full">
      <div className="flex items-center gap-2">
        <span className={`w-2.5 h-2.5 rounded-full ${c.dot}`}></span>
        <h2 className="text-lg font-semibold">{LABEL[inc.threat_class] || inc.threat_class}</h2>
        <span className={`text-xs uppercase ${c.text}`}>{inc.severity}</span>
      </div>

      <div className="mt-3 grid grid-cols-2 gap-x-6 gap-y-2 text-sm">
        <div><span className="text-slate-500">Source</span><div className="font-mono">{inc.src || "—"}</div></div>
        <div><span className="text-slate-500">Target</span><div className="font-mono">{inc.dst || "—"}</div></div>
        <div><span className="text-slate-500">Observations</span><div>{inc.count}</div></div>
        <div><span className="text-slate-500">Peak confidence</span><div>{(inc.peak_confidence*100).toFixed(0)}%</div></div>
        <div><span className="text-slate-500">First seen</span><div className="font-mono text-xs">{ago(inc.first_seen)}</div></div>
        <div><span className="text-slate-500">Last seen</span><div className="font-mono text-xs">{ago(inc.last_seen)}</div></div>
      </div>

      <h3 className="mt-5 mb-2 text-xs uppercase tracking-wide text-slate-400">Supporting evidence</h3>
      <div className="rounded-lg ring-1 ring-white/10 divide-y divide-white/5">
        {Object.entries(inc.evidence || {}).map(([k, v]) => (
          <div key={k} className="flex gap-4 px-3 py-2 text-sm">
            <span className="text-slate-400 w-48 shrink-0">{k.replace(/_/g," ")}</span>
            <span className="font-mono text-xs break-all">
              {Array.isArray(v) ? v.join(", ") : (v === null ? "—" : String(v))}
            </span>
          </div>
        ))}
      </div>

      <h3 className="mt-5 mb-2 text-xs uppercase tracking-wide text-slate-400">
        Recent alerts ({alerts.length})
      </h3>
      <div className="rounded-lg ring-1 ring-white/10 divide-y divide-white/5 text-xs font-mono">
        {alerts.map(a => (
          <div key={a.id} className="px-3 py-1.5 flex gap-3">
            <span className="text-slate-500">{ago(a.ts)}</span>
            <span className={SEV[a.severity]?.text}>{(a.confidence*100).toFixed(0)}%</span>
            <span className="text-slate-400 truncate">{a.detector}</span>
          </div>
        ))}
        {!alerts.length && <div className="px-3 py-2 text-slate-500">none</div>}
      </div>
    </div>
  );
}

function App() {
  const [sum, setSum] = useState(null);
  const [incs, setIncs] = useState([]);
  const [sel, setSel] = useState(null);
  const [filter, setFilter] = useState("");
  const [live, setLive] = useState(false);

  const load = () => {
    fetch("/api/summary").then(r => r.json()).then(setSum).catch(()=>{});
    fetch("/api/incidents?limit=200").then(r => r.json()).then(rows => {
      setIncs(rows);
      setSel(cur => cur || rows[0] || null);   // open on the most serious
    }).catch(()=>{});
  };

  useEffect(() => {
    load();
    let sock = null, timer = null, dead = false;
    const proto = location.protocol === "https:" ? "wss" : "ws";

    const connect = () => {
      if (dead) return;
      sock = new WebSocket(`${proto}://${location.host}/ws`);
      sock.onopen = () => setLive(true);
      sock.onmessage = e => {
        const m = JSON.parse(e.data);
        if (m.summary) setSum(m.summary);
        if (m.incidents) {
          setIncs(m.incidents);
          setSel(cur => cur || m.incidents[0] || null);
        }
      };
      sock.onclose = () => {
        setLive(false);
        if (!dead) timer = setTimeout(connect, 2000);   // keep trying
      };
      sock.onerror = () => sock.close();
    };

    connect();
    return () => { dead = true; clearTimeout(timer); if (sock) sock.close(); };
  }, []);

  const classes = [...new Set(incs.map(i => i.threat_class))];
  const shown = filter ? incs.filter(i => i.threat_class === filter) : incs;

  return (
    <div className="max-w-[1400px] mx-auto p-6">
      <header className="flex items-center gap-3 mb-5">
        <h1 className="text-xl font-semibold tracking-tight">NetObs</h1>
        <span className="text-xs text-slate-500">passive threat detection · read-only ingest</span>
        <span className="ml-auto flex items-center gap-2 text-xs">
          <span className={`w-2 h-2 rounded-full ${live ? "bg-emerald-400 animate-pulse" : "bg-slate-600"}`}></span>
          <span className="text-slate-400">{live ? "live" : "offline"}</span>
        </span>
      </header>

      <Summary s={sum} />

      <div className="flex gap-2 mb-3 flex-wrap">
        <button onClick={() => setFilter("")}
          className={`text-xs px-3 py-1.5 rounded-full ring-1 ring-white/10 ${!filter ? "bg-white/10" : "hover:bg-white/5"}`}>
          All ({incs.length})
        </button>
        {classes.map(c => (
          <button key={c} onClick={() => setFilter(c)}
            className={`text-xs px-3 py-1.5 rounded-full ring-1 ring-white/10 ${filter===c ? "bg-white/10" : "hover:bg-white/5"}`}>
            {LABEL[c] || c} ({incs.filter(i=>i.threat_class===c).length})
          </button>
        ))}
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-[minmax(340px,420px)_1fr] gap-4">
        <div className="rounded-xl ring-1 ring-white/10 overflow-hidden max-h-[70vh] overflow-y-auto">
          {shown.map(i => (
            <Row key={i.key} inc={i} active={sel && sel.key === i.key} onClick={() => setSel(i)} />
          ))}
          {!shown.length && <div className="p-8 text-center text-slate-500 text-sm">No incidents</div>}
        </div>
        <div className="rounded-xl ring-1 ring-white/10 max-h-[70vh]">
          <Detail inc={sel} />
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
